[package]
name = "dock"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1.0.102"
ash = "0.38.0"
bytemuck = "1.25.0"
memmap2 = "0.9.10"
rustix = "1.1.4"
wayland-backend = { version = "0.3.15", features = ["client_system"] }
wayland-client = "0.31.14"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[build-dependencies]
anyhow = "1.0.102"
bytemuck = "1.25.0"
naga = { version = "29.0.3", features = ["wgsl-in", "spv-out"] }
